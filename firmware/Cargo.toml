[workspace]
members = ["api", "boot", "light", "node", "wifi", "wire"]
# Separate lamp workspace prevents feature unification across different chip targets.
exclude = ["lamp"]
resolver = "3"

# A debug-profile cyw43 is too slow to keep the SPI bus fed and the join times out.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
