[package]
name = "room-lamp"
version = "0.2.1"
edition = "2024"
publish = false

# Detached from the thumbv6m workspace above; see the exclude there.
[workspace]

[features]
# Optional gate-order boot test; defaults preserve the remembered-state fade.
selftest = []
# The onboard WS2812. Off by default: a second light beside the fixture reads as a fault.
status-led = []

[dependencies]
room-api = { path = "../api" }
room-light = { path = "../light" }
room-wire = { path = "../wire" }

embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
	"udp",
	"tcp",
	"dhcpv4",
	"dhcpv4-hostname",
	"medium-ethernet",
	"proto-ipv4",
	# Answering ping is how the board is found on the LAN.
	"auto-icmp-echo-reply",
	"log"
] }
embassy-sync = "0.8"
embassy-time = "0.5.1"
# BlockingAsync, so the blocking esp-storage satisfies sequential-storage's async traits.
embassy-embedded-hal = "0.6.0"

# LEDC needs unstable. Exact pins keep compatible esp-hal/esp-radio versions together.
esp-hal = { version = "=1.1.2", features = ["esp32c3", "unstable", "log-04"] }
esp-rtos = { version = "=0.3.0", features = ["esp32c3", "embassy", "esp-radio", "log-04"] }
esp-radio = { version = "=1.0.0-beta.0", features = ["esp32c3", "wifi", "log-04"] }
esp-alloc = "0.10.0"
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-storage = { version = "0.9.0", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }

sequential-storage = "8.0.1"
heapless = "0.9"
log = "0.4"
static_cell = "2.1"

# The radio cannot keep up under plain debug.
[profile.dev]
opt-level = "s"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
