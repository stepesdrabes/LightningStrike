[package]
name = "room-node"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["frame"]
# The three fixtures this firmware drives. Exactly one, checked in src/fixture/mod.rs.
frame = ["strips"]
bounce = []
bench = ["strips"]
# Not a fixture: what the two addressable builds share, so the interrupt table and the
# dependency name it once rather than listing both every time.
strips = ["dep:smart-leds"]

[dependencies]
room-wire = { path = "../wire" }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
	"udp",
	"dhcpv4",
	"dhcpv4-hostname",
	"medium-ethernet",
	"proto-ipv4",
	# Answering ping is how the board is found on the LAN and how round-trip time gets measured
	# independently of the DDP stream.
	"auto-icmp-echo-reply",
	"log"
] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embassy-usb-logger = "0.6.0"
cyw43 = { version = "0.7.0", features = ["log"] }
cyw43-pio = "0.10.0"

# For SetDutyCycle, which writes the compare register and nothing else. Already in the tree
# under embassy-rp, so this names it rather than adding it.
embedded-hal = "1.0"
# The colour type embassy-rp's WS2812 driver takes. Same crate it depends on itself.
smart-leds = { version = "0.4.0", optional = true }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
heapless = "0.9"
log = "0.4"
panic-reset = "0.1.1"
static_cell = "2.1"

# thumbv6m has no CAS instructions; embassy needs the critical-section fallback to link.
portable-atomic = { version = "1.5", features = ["critical-section"] }
