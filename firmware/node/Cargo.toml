[package]
name = "room-node"
version = "0.3.0"
edition = "2024"
publish = false

[features]
default = ["frame"]
# Exactly one fixture per binary, enforced in src/fixture/mod.rs. The lamp is a separate target.
frame = []
bench = []
# Optional five-run boot test; default-off preserves Restore across power glitches.
selftest = []

[dependencies]
room-api = { path = "../api" }
room-light = { path = "../light" }
room-wifi = { path = "../wifi" }
room-wire = { path = "../wire" }

embassy-boot = "0.7.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
	"udp",
	"tcp",
	"dhcpv4",
	"dhcpv4-hostname",
	"medium-ethernet",
	"proto-ipv4",
	# Answering ping is how the board is found on the LAN.
	"auto-icmp-echo-reply",
	"log"
] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-sync = "0.8"
embassy-time = "0.5.1"
embedded-storage-async = "0.4.1"
sequential-storage = "8.0.1"
embassy-usb-logger = "0.6.0"
cyw43 = { version = "0.7.0", features = ["log"] }
cyw43-pio = "0.10.0"

# Already in the tree under embassy-rp; named for the RGBW type.
smart-leds = "0.4.0"
cortex-m-rt = "0.7.0"
heapless = "0.9"
log = "0.4"
panic-reset = "0.1.1"
static_cell = "2.1"

# thumbv6m has no CAS instructions; embassy needs the critical-section fallback to link.
portable-atomic = { version = "1.5", features = ["critical-section"] }
