[package]
name = "lightningstrike"
version = "0.1.0"
edition = "2021"
publish = false
description = "LightningStrike desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `macos-private-api`: it exists for transparent windows and vibrancy, neither of which this
# window uses, and it puts the webview on a compositing path that is not the opaque fast one.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

# Tauri answers with verbatim paths, which the Node sidecar cannot be started from.
[target.'cfg(windows)'.dependencies]
dunce = "1"

# For the one private WebKit call that lets the room draw above 60 fps. See `framerate.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
